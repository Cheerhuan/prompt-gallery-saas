name: Mobile Add — New Prompt

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Title (e.g. Neon Cyberpunk Portrait)'
        required: true
        type: string
      prompt:
        description: 'Full prompt text'
        required: true
        type: string
      model:
        description: 'Model (e.g. GPT-Image-2, Midjourney v6)'
        required: false
        default: 'GPT-Image-2'
        type: string
      image_url:
        description: 'Image URL (Pexels / GitHub raw / leave empty for no image)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  add-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add prompt to prompts.json
        run: |
          TITLE='${{ github.event.inputs.title }}'
          PROMPT='${{ github.event.inputs.prompt }}'
          MODEL='${{ github.event.inputs.model }}'
          IMAGE='${{ github.event.inputs.image_url }}'

          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('src/data/prompts.json', 'utf-8'));
          const maxId = data.reduce((m, p) => Math.max(m, parseInt(p.id, 10) || 0), 0);
          data.push({
            id: String(maxId + 1),
            title: process.env.TITLE,
            image: process.env.IMAGE || '',
            full_prompt: process.env.PROMPT,
            model: process.env.MODEL || 'GPT-Image-2',
            _version: new Date().toISOString().slice(0, 10),
            _source: 'mobile-add',
          });
          fs.writeFileSync('src/data/prompts.json', JSON.stringify(data, null, 2) + '\n');
          console.log('✅ Added prompt #' + (maxId + 1) + ': ' + process.env.TITLE);
          "

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit & Push
        run: |
          git config user.name "Mobile Bot"
          git config user.email "mobile@prompt-gallery-saas"
          git add src/data/prompts.json
          git commit -m "feat: mobile add — ${{ github.event.inputs.title }} [bot]" || echo "No changes"
          git push
